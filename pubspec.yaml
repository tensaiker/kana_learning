name: kana_learning
description: "A Flutter application for learning and practicing Kana handwriting."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

# --- RUNTIME DEPENDENCIES ---
dependencies:
  flutter:
    sdk: flutter

  # Dynamic Japanese pronunciation via on-device TTS engine
  flutter_tts: ^4.2.2

  # Device-local daily reminders (compatible with Dart 3.11).
  # Do NOT update flutter_local_notifications to 23 without upgrading Dart.
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1

  # Local persistence for lesson progress, streaks, settings, and onboarding status
  shared_preferences: ^2.2.2

  # UI iconography and custom typography
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1

# --- DEVELOPMENT DEPENDENCIES ---
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates adaptive home screen app icons for Android, iOS, and Web
  flutter_launcher_icons: ^0.13.1

  # Generates native OS boot splash drawables (fixes black screen & squircle artifacts)
  flutter_native_splash: ^2.4.1

# --- FLUTTER CONFIGURATION ---
flutter:
  uses-material-design: true

  # Static asset definitions
  assets:
    - assets/data/ # Preloaded vocabulary JSON files
    - assets/image/ # Logo, welcome_UI.png, splash and three onboarding images

# --- LAUNCHER ICON CONFIGURATION (flutter_launcher_icons) ---
# NOTE ON LOGO SIZING:
# Android Adaptive Icons crop the outer ~30% of the canvas.
# Ensure 'assets/image/cozy_kana_logo.png' has 20-25% transparent padding
# around the badge so the corners do not touch the launcher squircle edges.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true # Opaque iOS launcher icons (source PNG is transparent)
  # Opaque icon with larger illustration for legacy Android and iOS
  image_path: "assets/image/cozy_kana_launcher_legacy.png"
  min_sdk_android: 21

  # Adaptive icon: artwork is inset so Android launcher masks do not crop it.
  # Android 8.0+ Adaptive Icon configuration
  adaptive_icon_background: "#EADFD1" # Seamlessly blends with app canvas
  adaptive_icon_foreground: "assets/image/cozy_kana_launcher_foreground.png"

  # Web favicon and manifest generation
  web:
    generate: true
    image_path: "assets/image/cozy_kana_launcher_legacy.png"

# --- NATIVE SPLASH SCREEN CONFIGURATION (flutter_native_splash) ---
# Replaces the default black OS window while the Flutter engine initializes.
flutter_native_splash:
  color: "#FDF8F3"
  color_dark: "#FDF8F3" # Match the cozy cream background in dark mode
  image: "assets/image/splash_screen.png"
  android_gravity: center
  ios_content_mode: center
  web_image_mode: center

  # Android 12+ System Splash Screen API
  # OS controls splash icon display size; the artwork is padded to fit safely.
  android_12:
    # Android 12+ shows an OS-controlled icon, not a full-screen picture.
    color: "#FDF8F3"
    color_dark: "#FDF8F3"
    image: "assets/image/cozy_kana_android12_splash.png"
    icon_background_color: "#FDF8F3"
    icon_background_color_dark: "#FDF8F3"
